name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: yamllint, shellcheck and private values, in the pinned tools image
        run: make check

  # One stable name to require in branch protection, whatever jobs are added later.
  ci-ok:
    name: CI passed
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          [ "$FAILED" != "true" ]
