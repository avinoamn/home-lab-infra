# Tailscale from its apt repository, at the pinned version. Joining the tailnet (`tailscale up`), tagging the node
# and disabling its key expiry are done by hand once (docs/operations.md, "Installing a node from scratch").

- name: Tailscale's signing key is present
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_apt_distro }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "sha256:{{ tailscale_keyring_sha256 }}"
    owner: root
    group: root
    mode: "0644"

# The repository line is as long as Tailscale writes it.
# yamllint disable rule:line-length
- name: Tailscale's apt repository is configured
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      # Tailscale packages for ubuntu {{ tailscale_apt_distro }}
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_apt_distro }} main
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repo
# yamllint enable rule:line-length

- name: Tailscale is installed at the pinned version
  become: true
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: "{{ tailscale_repo is changed }}"

- name: The tailscaled service runs and starts at boot
  become: true
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
