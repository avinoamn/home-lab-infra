# The projects on the cluster, one entry each. Adding an entry onboards a project (docs/onboarding.md):
#   name       the project's name, which is also its namespace
#   grafana    true if Grafana should load dashboards and datasources from its namespace (and may read its
#              ConfigMaps and Secrets)
#   nodePorts  the NodePorts assigned to it: port and Service name (each also in docs/platform.md's registry);
#              their number is also the quota's NodePort count
#   hosts      the Ingress hostnames assigned to it (each also in the registry): `*.local` names, or
#              `<node>.<tailnet>.ts.net` for the node's own tailnet name (HTTPS on 443; one project only)
#   podSecurity  Pod Security level of its namespace: baseline (the default rule: no host network, host ports,
#              hostPath or privileged containers), restricted, or privileged (only with host ports registered in
#              docs/platform.md, and the reason recorded there)
#   quota      its ResourceQuota (docs/platform.md, "Guardrails"): requests.cpu, requests.memory, limits.memory,
#              pods, persistentvolumeclaims, requests.storage. Size it from what the project really uses (the Node
#              dashboard's "per namespace" panels) with room for its Jobs and a rollout.
# scripts/projects.sh renders each entry with projects/chart (namespace, deployer account, guardrails), and Helmfile
# reads the list for Grafana. `make check` checks the entries against the registry.
projects:
  - name: tickertape
    grafana: true
    nodePorts:
      - {port: 30002, service: ner-ui}
      - {port: 30003, service: laya-ui}
    hosts: [ner.local, laya.local]
    podSecurity: baseline
    # Measured 2026-10-28: requests 1.9 cores / 3.8 GiB, memory limits 8.75 GiB, 4 volumes (16 GiB); 7-day peaks laya
    # 2.3 GiB and 2 cores, ner 1.7 GiB. ner and laya use Recreate rollouts, so an upgrade never runs two of each.
    quota:
      requests.cpu: "3"
      requests.memory: 6Gi
      limits.memory: 12Gi
      pods: "30"
      persistentvolumeclaims: "10"
      requests.storage: 30Gi
  - name: cubicle
    grafana: false
    nodePorts: []
    # Its web UI needs HTTPS (camera and mic), so it is served on the node's tailnet name, not on a NodePort.
    hosts: ["<node>.<tailnet>.ts.net"]
    # LiveKit runs on the host network for its media ports (the registry's host ports, with the reason).
    podSecurity: privileged
    # Estimated from cubicle's design (section 1.7), not yet measured: the cubicle server 100m / 128Mi (limit 256Mi),
    # LiveKit 500m / 512Mi (limit 1Gi). Room for a RollingUpdate of the server (LiveKit uses Recreate) and one stray
    # pod. No volumes: all its state is in memory.
    quota:
      requests.cpu: "1"
      requests.memory: 1Gi
      limits.memory: 2Gi
      pods: "6"
      persistentvolumeclaims: "0"
      requests.storage: "0"
