{{- /* One ConfigMap per dashboard in dashboards/ (generated by gen_dashboards.py). Grafana's sidecar loads labelled
ConfigMaps from `monitoring`, into the folder named by the grafana_folder annotation. */ -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: platform
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
